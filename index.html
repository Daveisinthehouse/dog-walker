<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dog Walker</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bdcff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#9bdcff}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:grid;grid-template-columns:1fr auto 1fr;align-items:start;color:#17324d;font-weight:800;font-size:clamp(14px,2.4vw,24px);text-shadow:0 1px 0 #fff8;pointer-events:none}#hud .scoreBlock{text-align:center}#hud .bestBlock{text-align:left}#hud .allTimeBlock{text-align:right}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.card{background:#ffffffdd;border:3px solid #17324d;border-radius:20px;padding:20px 28px;box-shadow:0 8px 30px #17324d33}
.card h1{margin:0 0 5px;font-size:clamp(30px,6vw,58px)}
.card p{margin:5px 0;font-size:clamp(15px,2.5vw,23px)}
.card input{width:min(260px,80vw);padding:10px 12px;border:2px solid #17324d;border-radius:10px;font-size:16px;font-weight:700;text-align:center;margin:8px 0}
.card button{padding:10px 16px;border:2px solid #17324d;border-radius:10px;background:#17324d;color:#fff;font-size:15px;font-weight:900}
#leaderboard{margin:10px 0 0;text-align:left;font-size:14px;line-height:1.45}
#environment{position:absolute;top:max(58px,calc(env(safe-area-inset-top) + 48px));left:50%;transform:translateX(-50%);padding:5px 10px;border:2px solid #17324d;border-radius:999px;background:#ffffffb8;color:#17324d;font-size:12px;font-weight:900;letter-spacing:.04em;pointer-events:none;white-space:nowrap}
#energyHud{position:absolute;top:88px;left:50%;transform:translateX(-50%);width:min(320px,48vw);pointer-events:none;color:#17324d;font-size:11px;font-weight:1000;text-shadow:0 1px #fff8}
#energyLabel{display:flex;justify-content:space-between;margin-bottom:4px;letter-spacing:.06em}
#energyTrack{height:15px;border:2px solid #17324d;background:#472f32;padding:1px;box-shadow:0 2px 0 #ffffff77}
#energyFill{height:100%;width:100%;background:repeating-linear-gradient(90deg,#63d54b 0,#63d54b calc(10% - 3px),#245b35 calc(10% - 3px),#245b35 10%);transition:width .16s linear,filter .16s linear}
@media(orientation:portrait){#energyHud{top:clamp(145px,17vh,175px);width:min(320px,68vw)}}
@media(orientation:portrait){#environment{top:clamp(84px,10vh,110px)}}
.hidden{display:none!important}
#jump{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(58px,calc(env(safe-area-inset-bottom) + 40px));width:92px;height:92px;border-radius:50%;border:3px solid #17324d;background:#ffffffcc;font-size:18px;font-weight:900;color:#17324d;box-shadow:0 5px 15px #17324d33}
#fullscreen{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(72px,calc(env(safe-area-inset-bottom) + 54px));padding:9px 12px;border-radius:12px;border:2px solid #17324d;background:#ffffffcc;color:#17324d;font-size:13px;font-weight:900;box-shadow:0 3px 10px #17324d33;z-index:10}
@media (orientation:portrait){#hud{top:clamp(34px,6vh,64px)}}
@media(max-height:420px){#jump{width:72px;height:72px;font-size:15px}.card{padding:13px 22px}}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div id="hud"><span class="bestBlock">HIGH SCORE <span id="best">0</span>m</span><span class="scoreBlock">SCORE <span id="score">0</span>m</span><span class="allTimeBlock">ALL-TIME <span id="allTime">0</span>m</span></div>
<div id="environment">🌳 PARK</div>
<div id="energyHud" aria-label="Poop energy"><div id="energyLabel"><span>POOP ENERGY</span><span id="energyValue">100%</span></div><div id="energyTrack"><div id="energyFill"></div></div></div>
<div id="message"><div class="card"><h1>🐕 Dog Walker</h1><p>Hop over the poop!</p><p>Tap anywhere to start</p></div></div>
<button id="jump" aria-label="Jump">JUMP</button>
<button id="fullscreen" aria-label="Toggle full screen">⛶ FULL SCREEN</button>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,dpr,ground,playing=false,dead=false,last=0,distance=0,best=+localStorage.dogWalkerBest||0;
let globalBest=0, leaderboard=[];
let energy=100;const ENERGY_LOSS_PER_POOP=25;let poopsJumped=0;const POOPS_FOR_ENERGY=5;const ENERGY_RESTORE_PER_STREAK=25;
const LEADERBOARD_API='https://dog-walker.todavidmoore.workers.dev';
let speed=390,spawn=1.1,player,poops=[],dogs=[],clouds=[],jumpHeld=false;
let audioCtx=null,musicTimer=null,musicStep=0,musicStarted=false;
let scenerySeed=0;
const ENVIRONMENTS=[{name:"PARK",icon:"🌳"},{name:"TOWN STREET",icon:"🏘️"},{name:"BEACH",icon:"🏖️"},{name:"FOREST",icon:"🌲"}];
const DOG_BREEDS=[{name:"Labrador",body:"#b9824b",light:"#e2b477",dark:"#704526",shape:"lab"},{name:"Dalmatian",body:"#f4f0df",light:"#ffffff",dark:"#282828",shape:"spot"},{name:"Corgi",body:"#c98742",light:"#f5d5a0",dark:"#754321",shape:"corgi"},{name:"Terrier",body:"#8b6042",light:"#c49a70",dark:"#493426",shape:"terrier"},{name:"Dachshund",body:"#6f4932",light:"#a8754d",dark:"#3e281d",shape:"long"}];
document.getElementById('best').textContent=best;document.getElementById('allTime').textContent='0';
async function getGlobalScores(){try{const res=await fetch(LEADERBOARD_API+'/api/leaderboard');if(!res.ok)throw new Error('Leaderboard unavailable');const data=await res.json();leaderboard=Array.isArray(data)?data:(data.scores||[]);globalBest=leaderboard.length?leaderboard[0].score:0;document.getElementById('allTime').textContent=globalBest;}catch(e){globalBest=best;document.getElementById('allTime').textContent=globalBest}}
async function submitScore(name,score){const clean=(name||'Anonymous').trim().slice(0,20)||'Anonymous';try{const res=await fetch(LEADERBOARD_API+'/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player_name:clean,score:Math.floor(score)})});if(!res.ok)throw new Error('Could not save score');localStorage.dogWalkerPlayer=clean;await getGlobalScores();return true}catch(e){return false}}
getGlobalScores();
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ground=H*.78;if(player)player.y=ground-player.h-player.vy*0}addEventListener('resize',resize);resize();
function startMusic(){if(musicStarted)return;musicStarted=true;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const riff=[164.81,196,220,246.94,261.63,246.94,220,196,164.81,164.81,196,220,164.81,196,220,246.94,293.66,261.63,246.94,220,196,220,246.94,261.63];const roots=[82.41,82.41,82.41,82.41,110,110,82.41,82.41,123.47,110,82.41,123.47];function tone(freq,dur,type='square',vol=.025,when=0){const now=audioCtx.currentTime+when;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();osc.type=type;osc.frequency.value=freq;filter.type='lowpass';filter.frequency.value=type==='sawtooth'?1800:2600;gain.gain.setValueAtTime(vol,now);gain.gain.exponentialRampToValueAtTime(.001,now+dur);osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+dur)}function drum(type,when){const now=audioCtx.currentTime+when;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();if(type==='kick'){osc.type='sine';osc.frequency.setValueAtTime(120,now);osc.frequency.exponentialRampToValueAtTime(48,now+.12);gain.gain.setValueAtTime(.07,now);gain.gain.exponentialRampToValueAtTime(.001,now+.14)}else{osc.type='triangle';osc.frequency.value=type==='snare'?185:95;gain.gain.setValueAtTime(type==='snare'?.035:.02,now);gain.gain.exponentialRampToValueAtTime(.001,now+.07)}osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.15)}function noiseHit(dur,vol,when=0){const length=Math.max(1,Math.floor(audioCtx.sampleRate*dur));const buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate);const data=buffer.getChannelData(0);for(let j=0;j<length;j++)data[j]=(Math.random()*2-1)*(1-j/length);const src=audioCtx.createBufferSource(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();src.buffer=buffer;filter.type='highpass';filter.frequency.value=4500;gain.gain.setValueAtTime(vol,audioCtx.currentTime+when);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+when+dur);src.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);src.start(audioCtx.currentTime+when);src.stop(audioCtx.currentTime+when+dur)}function tick(){if(!playing){musicTimer=setTimeout(tick,160);return}const step=musicStep%96;const bar=Math.floor(step/8);const beat=step%8;const root=roots[bar%12];if(beat===0||beat===4)tone(root,.3,'triangle',.055);if(beat===2||beat===6)tone(root*1.5,.16,'triangle',.025);if(beat===0||beat===4)drum('kick',0);if(beat===2||beat===6)drum('snare',0);if(beat%2===0){const n=riff[(step*3+Math.floor(step/8)*2)%riff.length];tone(n,.17,'sawtooth',.025);tone(n*2,.12,'square',.008)}else if(Math.random()<.35){const blues=[164.81,196,220,233.08,246.94,293.66];tone(blues[Math.floor(Math.random()*blues.length)],.09,'square',.012)}if(beat%2===1)noiseHit(.035,.018);if(beat===2||beat===6){tone(1700,.025,'square',.012);noiseHit(.075,.045)}if(beat===3||beat===7)tone(7800,.018,'square',.008);musicStep++;const tempo=Math.max(105,155-(speed-390)*.035);musicTimer=setTimeout(tick,tempo)}tick()}catch(e){}}
function jumpSound(){if(!audioCtx)return;try{const now=audioCtx.currentTime;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='square';osc.frequency.setValueAtTime(260,now);osc.frequency.exponentialRampToValueAtTime(620,now+.16);gain.gain.setValueAtTime(.035,now);gain.gain.exponentialRampToValueAtTime(.001,now+.18);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.2)}catch(e){}}
function reset(){playing=true;dead=false;distance=0;speed=390;energy=100;poopsJumped=0;updateEnergyHud();spawn=.9;document.getElementById("environment").textContent="🌳 PARK";player={x:W*.15,y:ground-70,w:34,h:70,vy:0,onGround:true,run:0};poops=[];dogs=[];clouds=[];scenerySeed=Math.random()*1000;for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:40+Math.random()*H*.28,s:25+Math.random()*35,v:10+Math.random()*20});document.getElementById('message').classList.add('hidden')}
function jump(){startMusic();if(dead)return;if(!playing){reset();return}if(player.onGround){player.vy=-780;player.onGround=false;jumpHeld=true;jumpSound()}}
addEventListener('pointerdown',e=>{if(dead)return;if(e.target.id==='jump')return;if(e.target.closest('button,input'))return;jump()});
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jumpHeld=true;jump()});
function releaseJump(){jumpHeld=false}
document.getElementById('jump').addEventListener('pointerup',releaseJump);document.getElementById('jump').addEventListener('pointercancel',releaseJump);document.getElementById('jump').addEventListener('lostpointercapture',releaseJump);addEventListener('pointerup',releaseJump);addEventListener('pointercancel',releaseJump);
const fullscreenBtn=document.getElementById('fullscreen');
async function toggleFullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen();return}const target=document.getElementById('game');if(target.requestFullscreen){await target.requestFullscreen({navigationUI:'hide'});return}if(target.webkitRequestFullscreen){target.webkitRequestFullscreen();return}showFullscreenHelp()}catch(e){showFullscreenHelp()}}
function showFullscreenHelp(){const message=document.getElementById('message');message.innerHTML='<div class="card"><h1>⛶ Full Screen</h1><p>On iPhone, tap <b>Share</b> in your browser.</p><p>Choose <b>Add to Home Screen</b>, then open Dog Walker from your Home Screen.</p><p>Tap anywhere to close</p></div>';message.classList.remove('hidden');message.style.pointerEvents='auto';const close=()=>{message.classList.add('hidden');message.style.pointerEvents='none';message.removeEventListener('pointerdown',close)};message.addEventListener('pointerdown',close)}
fullscreenBtn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggleFullscreen()});document.addEventListener('fullscreenchange',()=>{fullscreenBtn.textContent=document.fullscreenElement?'⛶ EXIT FULL SCREEN':'⛶ FULL SCREEN'});document.addEventListener('webkitfullscreenchange',()=>{fullscreenBtn.textContent=document.webkitFullscreenElement?'⛶ EXIT FULL SCREEN':'⛶ FULL SCREEN'});addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&!e.repeat){e.preventDefault();jumpHeld=true;jump()}});addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')releaseJump();});
function rectHit(a,b){return a.x+5<b.x+b.w-4&&a.x+a.w-5>b.x+4&&a.y+8<b.y+b.h&&a.y+a.h>b.y+4}
function spawnPoop(){const size=18+Math.random()*7;const poopX=W+10+Math.random()*95;poops.push({x:poopX,y:ground-size*.72,w:size*1.35,h:size*.72});if(Math.random()<.22){const gap=22+Math.random()*18;const size2=17+Math.random()*6;poops.push({x:poopX+gap,y:ground-size2*.72,w:size2*1.35,h:size2*.72})}if(Math.random()<.62){const breed={...DOG_BREEDS[Math.floor(Math.random()*DOG_BREEDS.length)]};dogs.push({x:W+55+Math.random()*85,y:ground-52,w:breed.shape==="long"?66:breed.shape==="corgi"?54:60,h:52,...breed,phase:Math.random()*Math.PI*2,behavior:Math.random()<.28?"sniff":Math.random()<.18?"hop":"run",behaviorTime:0})}}
function drawBackground(dt){
  // Bright blue sky and chunky, pixel-art clouds.
  ctx.fillStyle='#8fd4ff';ctx.fillRect(0,0,W,H);
  clouds.forEach(c=>{
    c.x-=c.v*.18*dt;if(c.x<-120)c.x=W+120;
    const x=Math.round(c.x),y=Math.round(c.y),w=Math.round(c.s);
    ctx.fillStyle='#ffffff';ctx.fillRect(x,y,w+14,9);ctx.fillRect(x+8,y-7,Math.round(w*.62),12);ctx.fillRect(x+Math.round(w*.55),y-3,Math.round(w*.52),10);
    ctx.fillStyle='#e5f6ff';ctx.fillRect(x+4,y+9,Math.round(w*.88),4);
    ctx.fillStyle='#c4eaff';ctx.fillRect(x+12,y+13,Math.round(w*.48),2);
  });

  // Distant mountains move slowly; stepped highlights keep the 16-bit look.
  const mountainOff=-(distance*13%440);
  for(let x=mountainOff-440;x<W+440;x+=440){
    ctx.fillStyle='#8ba9b6';ctx.beginPath();ctx.moveTo(x,ground-118);ctx.lineTo(x+76,ground-204);ctx.lineTo(x+118,ground-160);ctx.lineTo(x+218,ground-270);ctx.lineTo(x+296,ground-163);ctx.lineTo(x+356,ground-220);ctx.lineTo(x+440,ground-118);ctx.closePath();ctx.fill();
    ctx.fillStyle='#d0e0df';ctx.fillRect(x+205,ground-251,14,7);ctx.fillRect(x+219,ground-244,12,7);ctx.fillRect(x+225,ground-237,11,6);
    ctx.fillStyle='#708f9e';ctx.beginPath();ctx.moveTo(x+218,ground-270);ctx.lineTo(x+160,ground-181);ctx.lineTo(x+202,ground-197);ctx.lineTo(x+220,ground-181);ctx.lineTo(x+247,ground-205);ctx.lineTo(x+296,ground-163);ctx.closePath();ctx.fill();
  }

  // Rolling green hills: faster than mountains, slower than the forest.
  const hillOff=-(distance*25%220);
  for(let x=hillOff-220;x<W+220;x+=220){
    ctx.fillStyle='#9bcf91';ctx.fillRect(x,ground-111,220,15);
    ctx.fillStyle='#8bc483';ctx.fillRect(x+20,ground-126,150,15);ctx.fillRect(x+45,ground-137,92,11);
    ctx.fillStyle='#b3d99b';ctx.fillRect(x+30,ground-121,45,5);ctx.fillRect(x+150,ground-111,28,5);
  }

  // Low woodland-coloured ground stays behind the tree trunks.
  ctx.fillStyle='#9b704b';ctx.fillRect(0,ground-98,W,78);
  ctx.fillStyle='#805638';ctx.fillRect(0,ground-24,W,4);
  const soilOff=-(distance*100%37);
  for(let x=soilOff-37;x<W+37;x+=37){
    const xx=Math.round(x);
    ctx.fillStyle='#754c34';ctx.fillRect(xx+4,ground-82,4,3);ctx.fillRect(xx+23,ground-57,3,3);ctx.fillRect(xx+12,ground-36,5,2);
    ctx.fillStyle='#c18b5a';ctx.fillRect(xx+15,ground-72,5,2);ctx.fillRect(xx+29,ground-43,3,3);
  }

  // A thin grass verge and pixel tufts sit in front of the woodland.
  // Distinct scrolling biomes rotate every 900 metres; collision and ground physics are untouched.
  const envIndex=Math.floor(distance/250)%ENVIRONMENTS.length,env=ENVIRONMENTS[envIndex];
  const badge=document.getElementById('environment');if(badge)badge.textContent=env.icon+' '+env.name;
  const sceneOffset=-(distance*66%180);
  if(envIndex===0){
    // Park: layered rolling lawns, clipped hedges and a scrolling wooden fence.
    ctx.fillStyle='#9bcf91';ctx.fillRect(0,ground-155,W,127);
    const parkOffset=-(distance*24%240);
    for(let x=parkOffset-240;x<W+240;x+=240){
      const xx=Math.round(x);
      ctx.fillStyle='#8bc483';ctx.fillRect(xx,ground-115,150,18);ctx.fillRect(xx+22,ground-128,112,13);ctx.fillRect(xx+145,ground-105,95,12);
      ctx.fillStyle='#b3d99b';ctx.fillRect(xx+18,ground-113,48,4);ctx.fillRect(xx+164,ground-103,34,4);
      ctx.fillStyle='#6eae69';ctx.fillRect(xx+4,ground-91,74,9);ctx.fillRect(xx+82,ground-87,55,6);
      // Small park fence peeking through the trees.
      ctx.fillStyle='#a97549';ctx.fillRect(xx+150,ground-82,76,4);ctx.fillRect(xx+154,ground-91,4,18);ctx.fillRect(xx+178,ground-91,4,18);ctx.fillRect(xx+202,ground-91,4,18);ctx.fillRect(xx+222,ground-91,4,18);
      ctx.fillStyle='#d3a16a';ctx.fillRect(xx+154,ground-90,4,3);ctx.fillRect(xx+178,ground-90,4,3);ctx.fillRect(xx+202,ground-90,4,3);ctx.fillRect(xx+222,ground-90,4,3);
      // Tiny flower patches add colour without competing with the player.
      ctx.fillStyle='#f0d76c';ctx.fillRect(xx+18,ground-48,4,4);ctx.fillRect(xx+31,ground-43,4,4);ctx.fillRect(xx+43,ground-50,4,4);
      ctx.fillStyle='#e98d9c';ctx.fillRect(xx+24,ground-56,4,4);ctx.fillRect(xx+49,ground-44,4,4);
      ctx.fillStyle='#fff0cf';ctx.fillRect(xx+20,ground-47,2,2);ctx.fillRect(xx+45,ground-49,2,2);
    }

  else if(envIndex===1){ctx.fillStyle='#b9d7e4';ctx.fillRect(0,ground-250,W,222);const colours=['#d98f72','#e6c17c','#a6c4b0','#c6a2c9','#d7b5a0'];let bi=0;for(let x=sceneOffset-180;x<W+180;x+=180){const xx=Math.round(x),bh=100+((bi*37)%75);ctx.fillStyle=colours[bi%colours.length];ctx.fillRect(xx,ground-28-bh,116,bh);ctx.fillStyle='#f6e6c8';ctx.fillRect(xx+12,ground-38-bh,92,10);for(let wy=ground-bh+5;wy<ground-48;wy+=30){ctx.fillStyle='#6c9db1';ctx.fillRect(xx+12,wy,19,17);ctx.fillRect(xx+48,wy,19,17);ctx.fillStyle='#f7d78a';ctx.fillRect(xx+15,wy+3,13,11);ctx.fillRect(xx+51,wy+3,13,11)}ctx.fillStyle='#e8b9a0';ctx.fillRect(xx+78,ground-63,23,35);ctx.fillStyle='#454f5c';ctx.fillRect(xx+87,ground-118,4,54);ctx.fillStyle='#f4d36b';ctx.fillRect(xx+79,ground-123,20,9);bi++}}

}function drawPerson(){

function drawPoop(o){ctx.save();ctx.translate(o.x,o.y);const t=performance.now()/360;ctx.strokeStyle='#806b3b';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(o.w*.28,-3);ctx.quadraticCurveTo(o.w*.05,-10+Math.sin(t+o.x*.02)*3,o.w*.28,-17);ctx.moveTo(o.w*.52,-4);ctx.quadraticCurveTo(o.w*.76,-12+Math.sin(t+1.7+o.x*.02)*3,o.w*.54,-21);ctx.moveTo(o.w*.75,-3);ctx.quadraticCurveTo(o.w*.98,-9+Math.sin(t+3+o.x*.02)*2,o.w*.78,-14);ctx.stroke();for(let i=0;i<2;i++){const a=t*(i?1.25:-1)+(o.x*.01)+i*Math.PI;const fx=o.w*.5+Math.cos(a)*(o.w*.65+5);const fy=-12+Math.sin(a*1.3)*(7+i*2);ctx.strokeStyle='#242424';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(fx-2,fy-2);ctx.lineTo(fx+2,fy+2);ctx.moveTo(fx+2,fy-2);ctx.lineTo(fx-2,fy+2);ctx.stroke();ctx.fillStyle='#252525';ctx.beginPath();ctx.arc(fx,fy,2,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#70401f';ctx.beginPath();ctx.moveTo(0,o.h);ctx.quadraticCurveTo(3,2,o.w*.35,o.h*.55);ctx.quadraticCurveTo(o.w*.45,0,o.w*.65,o.h*.5);ctx.quadraticCurveTo(o.w*.9,o.h*.1,o.w,o.h);ctx.closePath();ctx.fill();ctx.fillStyle='#8c582d';ctx.beginPath();ctx.arc(o.w*.7,o.h*.45,2.5,0,7);ctx.fill();ctx.restore()}
function drawDog(d){ctx.save();ctx.translate(d.x+d.w,d.y);ctx.scale(-1,1);const now=performance.now(),run=Math.sin(now/65+d.phase),wag=Math.sin(now/72+d.phase)*9;const sniff=d.behavior==="sniff"&&Math.sin(now/160+d.phase)>.1,hop=d.behavior==="hop"?Math.max(0,Math.sin(now/180+d.phase))*5:0;ctx.translate(0,-hop);ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(30,50+hop,30,5,0,0,7);ctx.fill();ctx.strokeStyle=d.dark;ctx.lineWidth=d.shape==="corgi"?4:5;ctx.lineCap='round';ctx.beginPath();const tailBase=d.shape==="corgi"?13:d.shape==="long"?5:18;ctx.moveTo(51,tailBase);ctx.quadraticCurveTo(61,tailBase-8+wag*.45,59+wag,tailBase-16+wag);ctx.stroke();ctx.fillStyle=d.body;const bodyX=d.shape==="long"?9:17,bodyW=d.shape==="long"?43:d.shape==="corgi"?35:35,bodyY=d.shape==="corgi"?18:15,bodyH=d.shape==="long"?17:23;ctx.fillRect(bodyX,bodyY,bodyW,bodyH);ctx.fillStyle=d.light;ctx.fillRect(bodyX+5,bodyY-4,bodyW-10,8);ctx.fillRect(bodyX+7,bodyY+bodyH-5,Math.max(10,bodyW-14),5);ctx.strokeStyle=d.dark;ctx.lineWidth=d.shape==="corgi"?6:5;ctx.beginPath();const legY=bodyY+bodyH-1;ctx.moveTo(bodyX+7,legY);ctx.lineTo(bodyX+5+run*3,49);ctx.moveTo(bodyX+17,legY);ctx.lineTo(bodyX+19-run*3,49);ctx.moveTo(bodyX+bodyW-11,legY);ctx.lineTo(bodyX+bodyW-12-run*3,49);ctx.stroke();ctx.fillStyle=d.body;const headY=sniff?25:19,headR=d.shape==="corgi"?12:d.shape==="terrier"?13:14;ctx.beginPath();ctx.ellipse(12,headY,headR,headR*.92,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=d.light;ctx.fillRect(-2,headY+3,14,7);ctx.fillStyle=d.dark;if(d.shape==="corgi"){ctx.beginPath();ctx.moveTo(5,10);ctx.lineTo(2,-1);ctx.lineTo(12,7);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(15,9);ctx.lineTo(21,-1);ctx.lineTo(22,13);ctx.closePath();ctx.fill()}else if(d.shape==="terrier"){ctx.fillRect(1,6,7,13);ctx.fillRect(13,6,7,12)}else{ctx.beginPath();ctx.moveTo(7,8);ctx.lineTo(d.shape==="long"?-8:0,1);ctx.lineTo(2,22);ctx.lineTo(9,17);ctx.closePath();ctx.fill()}ctx.fillStyle='#171717';ctx.fillRect(7,headY-4,3,3);ctx.fill function update(dt){if(!playing||dead)return;distance+=speed*dt/100;speed+=dt*7.5;player.run+=dt;player.vy+=(jumpHeld&&player.vy<0?1250:2100)*dt;player.y+=player.vy*dt;if(player.y+player.h>=ground){player.y=ground-player.h;player.vy=0;player.onGround=true;player.boosting=false}spawn-=dt;if(spawn<=0){spawnPoop();spawn=Math.max(.62,1.25-speed/1200)+(Math.random()*.55);if(Math.random()<.16)spawn-=.2}poops.forEach(o=>o.x-=speed*dt);dogs.forEach(d=>d.x-=speed*dt);poops=poops.filter(o=>o.x>-60);dogs=dogs.filter(d=>d.x>-100);for(const o of poops){if(!o.hitPlayer&&rectHit(player,o)){o.hitPlayer=true;energy=Math.max(0,energy-ENERGY_LOSS_PER_POOP);updateEnergyHud();if(energy===0){gameOver();break}}if(!o.hitPlayer&&!o.countedPass&&o.x+o.w<player.x){o.countedPass=true;poopsJumped++;if(poopsJumped%POOPS_FOR_ENERGY===0){energy=Math.min(100,energy+ENERGY_RESTORE_PER_STREAK);updateEnergyHud()}}}}
function updateEnergyHud(){const fill=document.getElementById("energyFill"),value=document.getElementById("energyValue");if(!fill||!value)return;fill.style.width=energy+"%";value.textContent=energy+"%";fill.style.filter=energy<=25?"saturate(1.4) brightness(.9)":"none";fill.style.background=energy>50?"repeating-linear-gradient(90deg,#63d54b 0,#63d54b calc(10% - 3px),#245b35 calc(10% - 3px),#245b35 10%)":energy>25?"repeating-linear-gradient(90deg,#ffd447 0,#ffd447 calc(10% - 3px),#8b6b19 calc(10% - 3px),#8b6b19 10%)":"repeating-linear-gradient(90deg,#ff514b 0,#ff514b calc(10% - 3px),#8e2424 calc(10% - 3px),#8e2424 10%)"}
function gameOver(){dead=true;playing=false;const runScore=Math.floor(distance);best=Math.max(best,runScore);localStorage.dogWalkerBest=best;document.getElementById('best').textContent=best;const savedName=(localStorage.dogWalkerPlayer||'').replace(/"/g,'&quot;');document.getElementById('message').innerHTML='<div class="card"><h1>💩 SPLAT!</h1><p>💨 Your poop energy ran out!</p><p>You walked <b>'+runScore+'m</b></p><p>🏆 WORLD BEST: <b id="worldBestEnd">'+globalBest+'m</b></p><input id="playerName" maxlength="20" placeholder="Your name" value="'+savedName+'"><br><button id="submitScore">SAVE SCORE</button> <button id="playAgain">PLAY AGAIN</button><div id="leaderboard"></div></div>';document.getElementById('message').classList.remove('hidden');document.getElementById('message').style.pointerEvents='auto';renderLeaderboard();document.getElementById('submitScore').addEventListener('click',async e=>{e.stopPropagation();const btn=e.currentTarget;btn.disabled=true;btn.textContent='SAVING...';const ok=await submitScore(document.getElementById('playerName').value,runScore);btn.textContent=ok?'SAVED ✓':'TRY AGAIN';document.getElementById('worldBestEnd').textContent=globalBest+'m';renderLeaderboard()});document.getElementById('playAgain').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();document.getElementById('message').style.pointerEvents='none';reset()})}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function draw(){const zoom=1+Math.min(.5,Math.max(0,(speed-390)/500));const anchorX=player?player.x+player.w/2:W*.15;ctx.save();ctx.translate(anchorX,ground);ctx.scale(zoom,zoom);ctx.translate(-anchorX,-ground);drawBackground(1/60);dogs.forEach(drawDog);poops.forEach(drawPoop);if(player)drawPerson();ctx.restore();document.getElementById('score').textContent=Math.floor(distance)}
