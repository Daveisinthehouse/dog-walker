<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dog Walker</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bdcff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#9bdcff}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:flex;justify-content:space-between;color:#17324d;font-weight:800;font-size:clamp(14px,2.4vw,24px);text-shadow:0 1px 0 #fff8;pointer-events:none}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.card{background:#ffffffdd;border:3px solid #17324d;border-radius:20px;padding:20px 28px;box-shadow:0 8px 30px #17324d33}
.card h1{margin:0 0 5px;font-size:clamp(30px,6vw,58px)}
.card p{margin:5px 0;font-size:clamp(15px,2.5vw,23px)}
.hidden{display:none!important}
#jump{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;border:3px solid #17324d;background:#ffffffcc;font-size:18px;font-weight:900;color:#17324d;box-shadow:0 5px 15px #17324d33}
@media(max-height:420px){#jump{width:72px;height:72px;font-size:15px}.card{padding:13px 22px}}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div id="hud"><span>💩 <span id="score">0</span>m</span><span>BEST <span id="best">0</span>m</span></div>
<div id="message"><div class="card"><h1>🐕 Dog Walker</h1><p>Hop over the poop!</p><p>Tap anywhere to start</p></div></div>
<button id="jump" aria-label="Jump">JUMP</button>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,dpr,ground,playing=false,dead=false,last=0,distance=0,best=+localStorage.dogWalkerBest||0;
let speed=390,spawn=1.1,player,poops=[],dogs=[],clouds=[];
let scenerySeed=0;
document.getElementById('best').textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ground=H*.78;if(player)player.y=ground-player.h-player.vy*0}
addEventListener('resize',resize);resize();

function reset(){
 playing=true;dead=false;distance=0;speed=390;spawn=.9;
 player={x:W*.15,y:ground-70,w:34,h:70,vy:0,onGround:true,run:0};
 poops=[];dogs=[];clouds=[]; scenerySeed=Math.random()*1000;
 for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:40+Math.random()*H*.28,s:25+Math.random()*35,v:10+Math.random()*20});
 document.getElementById('message').classList.add('hidden');
}
function jump(){
 if(!playing){reset();return}
 if(dead){reset();return}
 if(player.onGround){player.vy=-780;player.onGround=false}
}
addEventListener('pointerdown',e=>{if(e.target.id!=='jump')jump()});
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')jump()});

function rectHit(a,b){return a.x+5<b.x+b.w-4&&a.x+a.w-5>b.x+4&&a.y+8<b.y+b.h&&a.y+a.h>b.y+4}
function spawnPoop(){
 const size=18+Math.random()*7;
 poops.push({x:W+20,y:ground-size*.72,w:size*1.35,h:size*.72});
 if(Math.random()<.55)dogs.push({x:W+70,y:ground-52,w:58,h:52});
}
function drawBackground(dt){
 ctx.fillStyle='#8b5a36';ctx.fillRect(0,0,W,H);
 // subtle 16-bit dirt blemishes behind the trees
 ctx.fillStyle='#704526';
 const blemishOff=-(distance*1.1%37);
 for(let x=blemishOff-37;x<W+37;x+=37){
   const y=55+((Math.floor(x/37)%5)*28);
   ctx.fillRect(x,y,3,2);ctx.fillRect(x+11,y+14,5,2);ctx.fillRect(x+25,y+5,2,3);
 }
 ctx.fillStyle='#a16c43';
 for(let x=blemishOff-20;x<W+37;x+=53){
   const y=82+((Math.floor(x/53)%4)*31);
   ctx.fillRect(x,y,4,2);ctx.fillRect(x+17,y+11,2,2);
 }

 // 16-bit style parallax clouds — slowest layer
 clouds.forEach(c=>{
   c.x-=c.v*.18*dt;
   if(c.x<-120)c.x=W+120;
   ctx.fillStyle='#fff';
   ctx.fillRect(c.x,c.y,c.s*1.15,10);
   ctx.fillRect(c.x+8,c.y-7,c.s*.65,12);
   ctx.fillRect(c.x+c.s*.55,c.y-3,c.s*.55,10);
   ctx.fillStyle='#e5f6ff';
   ctx.fillRect(c.x+4,c.y+10,c.s*.9,5);
 });

 // far hills — very slow
 const farOff=-(distance*.18%180);
 ctx.fillStyle='#9acb9a';
 for(let x=farOff-180;x<W+180;x+=180){
   ctx.beginPath();ctx.arc(x+90,ground-125,92,Math.PI,Math.PI*2);ctx.fill();
 }

 // distant tree layer 1 — small, fast-moving silhouettes
 const distant1Off=-(distance*0.55%95);
 for(let x=distant1Off-95;x<W+95;x+=95){
   const y=ground-72;
   ctx.fillStyle='#6fa878';ctx.fillRect(x+40,y-30,7,32);
   ctx.fillStyle='#5d9b67';
   ctx.fillRect(x+24,y-52,38,28);
   ctx.fillRect(x+31,y-62,24,16);
 }

 // distant tree layer 2 — a second horizon of chunky trees
 const distant2Off=-(distance*0.85%125);
 for(let x=distant2Off-125;x<W+125;x+=125){
   const y=ground-63;
   ctx.fillStyle='#668f5d';ctx.fillRect(x+53,y-40,9,42);
   ctx.fillStyle='#4f8250';
   ctx.fillRect(x+34,y-69,48,32);
   ctx.fillRect(x+42,y-80,31,18);
 }

 // midground tree layer — classic 16-bit chunky trees
 const midOff=-(distance*4.2%150);
 for(let x=midOff-150;x<W+150;x+=150){
   const y=ground-55;
   ctx.fillStyle='#765034';ctx.fillRect(x+66,y-48,13,55);
   ctx.fillStyle='#4f9b55';
   ctx.fillRect(x+35,y-85,75,45);
   ctx.fillRect(x+48,y-100,48,20);
   ctx.fillStyle='#397943';
   ctx.fillRect(x+25,y-65,20,22);
   ctx.fillRect(x+102,y-67,18,24);
 }

 // grass
 ctx.fillStyle='#68b95b';ctx.fillRect(0,ground,W,H-ground);

 // foreground hedge/grass tufts — faster layer
 const fgOff=-(distance*.75%52);
 ctx.fillStyle='#4b9d4d';
 for(let x=fgOff-52;x<W+52;x+=52){
   ctx.fillRect(x,ground-8,4,8);
   ctx.fillRect(x+9,ground-13,4,13);
   ctx.fillRect(x+19,ground-7,4,7);
 }

 // pavement
 ctx.fillStyle='#b9b9b9';ctx.fillRect(0,ground-20,W,20);
 ctx.fillStyle='#8d8d8d';ctx.fillRect(0,ground,W,3);
 ctx.strokeStyle='#a2a2a2';ctx.lineWidth=2;
 const offset=-(distance*2.2%70);
 for(let x=offset;x<W;x+=70){ctx.beginPath();ctx.moveTo(x,ground-20);ctx.lineTo(x,ground);ctx.stroke()}
}
function drawPerson(){
 const p=player, bob=p.onGround?Math.sin(p.run*12)*2:0;
 ctx.save();ctx.translate(p.x,p.y+bob);
 // shadow
 ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(17,72,23,5,0,0,7);ctx.fill();
 // legs
 ctx.strokeStyle='#26384a';ctx.lineWidth=7;ctx.lineCap='round';
 let swing=p.onGround?Math.sin(p.run*12)*9:0;
 ctx.beginPath();ctx.moveTo(14,48);ctx.lineTo(11-swing*.35,68);ctx.moveTo(22,48);ctx.lineTo(25+swing*.35,68);ctx.stroke();
 // shoes
 ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(7-swing*.35,68);ctx.lineTo(15-swing*.35,68);ctx.moveTo(22+swing*.35,68);ctx.lineTo(31+swing*.35,68);ctx.stroke();
 // body
 ctx.fillStyle='#e85b52';ctx.fillRect(8,18,20,31);
 // arms
 ctx.strokeStyle='#f0b58e';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(9,23);ctx.lineTo(1,39+swing*.25);ctx.moveTo(27,23);ctx.lineTo(34,38-swing*.25);ctx.stroke();
 // head
 ctx.fillStyle='#f0b58e';ctx.beginPath();ctx.arc(18,10,11,0,7);ctx.fill();
 // hair
 ctx.fillStyle='#38271f';ctx.beginPath();ctx.arc(18,6,11,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(8,4,20,6);
 ctx.restore();
}
function drawPoop(o){
 ctx.save();ctx.translate(o.x,o.y);
 ctx.fillStyle='#70401f';ctx.beginPath();ctx.moveTo(0,o.h);ctx.quadraticCurveTo(3,2,o.w*.35,o.h*.55);ctx.quadraticCurveTo(o.w*.45,0,o.w*.65,o.h*.5);ctx.quadraticCurveTo(o.w*.9,o.h*.1,o.w,o.h);ctx.closePath();ctx.fill();
 ctx.fillStyle='#8c582d';ctx.beginPath();ctx.arc(o.w*.7,o.h*.45,2.5,0,7);ctx.fill();ctx.restore();
}
function drawDog(d){
 // Dog is flipped 180 degrees and stays planted while the world scrolls past.
 ctx.save();ctx.translate(d.x+d.w,d.y);ctx.scale(-1,1);
 const step=0;
 // shadow
 ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(29,50,27,5,0,0,7);ctx.fill();
 // tail, raised and wagging
 ctx.strokeStyle='#7a4a2b';ctx.lineWidth=5;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(51,18);ctx.quadraticCurveTo(64,7,59,0);ctx.stroke();
 // body
 ctx.fillStyle='#a96b3d';ctx.fillRect(17,15,35,23);
 ctx.fillStyle='#c5844d';ctx.fillRect(23,11,24,9);
 // back highlight
 ctx.fillStyle='#c98a52';ctx.fillRect(24,14,25,4);
 // four chunky legs
 ctx.strokeStyle='#754526';ctx.lineWidth=7;
 ctx.beginPath();
 ctx.moveTo(23,35);ctx.lineTo(20-step,49);
 ctx.moveTo(35,35);ctx.lineTo(37+step,49);
 ctx.moveTo(45,35);ctx.lineTo(43-step,49);
 ctx.stroke();
 // head at LEFT = clear direction of travel
 ctx.fillStyle='#a96b3d';ctx.beginPath();ctx.arc(12,19,14,0,7);ctx.fill();
 // muzzle
 ctx.fillStyle='#d39a65';ctx.fillRect(-2,22,13,8);
 // floppy ear
 ctx.fillStyle='#754526';ctx.beginPath();ctx.moveTo(7,8);ctx.lineTo(-4,2);ctx.lineTo(1,21);ctx.lineTo(9,17);ctx.closePath();ctx.fill();
 // eye + nose
 ctx.fillStyle='#161616';ctx.fillRect(7,15,3,3);ctx.fillRect(-2,25,4,4);
 // collar
 ctx.fillStyle='#d94d4d';ctx.fillRect(5,27,13,4);
 ctx.restore();
}
function update(dt){
 if(!playing||dead)return;
 distance+=speed*dt/100;
 speed+=dt*5;
 player.run+=dt;
 player.vy+=2100*dt;player.y+=player.vy*dt;
 if(player.y+player.h>=ground){player.y=ground-player.h;player.vy=0;player.onGround=true}
 spawn-=dt;if(spawn<=0){spawnPoop();spawn=Math.max(.62,1.25-speed/1200)+(Math.random()*.55);if(Math.random()<.16)spawn-=.2}
 poops.forEach(o=>o.x-=speed*dt);dogs.forEach(d=>d.x-=speed*dt);
 poops=poops.filter(o=>o.x>-60);dogs=dogs.filter(d=>d.x>-100);
 for(const o of poops)if(rectHit(player,o)){gameOver();break}
}
function gameOver(){
 dead=true;playing=false;best=Math.max(best,Math.floor(distance));localStorage.dogWalkerBest=best;
 document.getElementById('best').textContent=best;
 document.getElementById('message').innerHTML='<div class="card"><h1>💩 SPLAT!</h1><p>You walked <b>'+Math.floor(distance)+'m</b></p><p>Tap to try again</p></div>';
 document.getElementById('message').classList.remove('hidden');
}
function draw(){
 drawBackground(1/60);
 dogs.forEach(drawDog);poops.forEach(drawPoop);
 if(player)drawPerson();
 document.getElementById('score').textContent=Math.floor(distance);
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body></html>
