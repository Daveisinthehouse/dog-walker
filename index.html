<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dog Walker</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bdcff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#9bdcff}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:grid;grid-template-columns:1fr auto 1fr;align-items:start;color:#17324d;font-weight:800;font-size:clamp(14px,2.4vw,24px);text-shadow:0 1px 0 #fff8;pointer-events:none}#hud .scoreBlock{text-align:center}#hud .bestBlock{text-align:left}#hud .allTimeBlock{text-align:right}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.card{background:#ffffffdd;border:3px solid #17324d;border-radius:20px;padding:20px 28px;box-shadow:0 8px 30px #17324d33}
.card h1{margin:0 0 5px;font-size:clamp(30px,6vw,58px)}
.card p{margin:5px 0;font-size:clamp(15px,2.5vw,23px)}
.card input{width:min(260px,80vw);padding:10px 12px;border:2px solid #17324d;border-radius:10px;font-size:16px;font-weight:700;text-align:center;margin:8px 0}
.card button{padding:10px 16px;border:2px solid #17324d;border-radius:10px;background:#17324d;color:#fff;font-size:15px;font-weight:900}
#leaderboard{margin:10px 0 0;text-align:left;font-size:14px;line-height:1.45}
.hidden{display:none!important}
#jump{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(58px,calc(env(safe-area-inset-bottom) + 40px));width:92px;height:92px;border-radius:50%;border:3px solid #17324d;background:#ffffffcc;font-size:18px;font-weight:900;color:#17324d;box-shadow:0 5px 15px #17324d33}
#fullscreen{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(72px,calc(env(safe-area-inset-bottom) + 54px));padding:9px 12px;border-radius:12px;border:2px solid #17324d;background:#ffffffcc;color:#17324d;font-size:13px;font-weight:900;box-shadow:0 3px 10px #17324d33;z-index:10}
@media (orientation:portrait){#hud{top:clamp(34px,6vh,64px)}}
@media(max-height:420px){#jump{width:72px;height:72px;font-size:15px}.card{padding:13px 22px}}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div id="hud"><span class="bestBlock">HIGH SCORE <span id="best">0</span>m</span><span class="scoreBlock">SCORE <span id="score">0</span>m</span><span class="allTimeBlock">ALL-TIME <span id="allTime">0</span>m</span></div>
<div id="message"><div class="card"><h1>🐕 Dog Walker</h1><p>Hop over the poop!</p><p>Tap anywhere to start</p></div></div>
<button id="jump" aria-label="Jump">JUMP</button>
<button id="fullscreen" aria-label="Toggle full screen">⛶ FULL SCREEN</button>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,dpr,ground,playing=false,dead=false,last=0,distance=0,best=+localStorage.dogWalkerBest||0;
let globalBest=0, leaderboard=[];
const LEADERBOARD_API='https://dog-walker.todavidmoore.workers.dev';
let speed=390,spawn=1.1,player,poops=[],dogs=[],clouds=[],stars=[],starSpawn=3;
let audioCtx=null,musicTimer=null,musicStep=0,musicStarted=false;
let scenerySeed=0;
document.getElementById('best').textContent=best;document.getElementById('allTime').textContent='0';
async function getGlobalScores(){try{const res=await fetch(LEADERBOARD_API+'/api/leaderboard');if(!res.ok)throw new Error('Leaderboard unavailable');const data=await res.json();leaderboard=Array.isArray(data)?data:(data.scores||[]);globalBest=leaderboard.length?leaderboard[0].score:0;document.getElementById('allTime').textContent=globalBest;}catch(e){globalBest=best;document.getElementById('allTime').textContent=globalBest}}
async function submitScore(name,score){const clean=(name||'Anonymous').trim().slice(0,20)||'Anonymous';try{const res=await fetch(LEADERBOARD_API+'/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player_name:clean,score:Math.floor(score)})});if(!res.ok)throw new Error('Could not save score');localStorage.dogWalkerPlayer=clean;await getGlobalScores();return true}catch(e){return false}}
getGlobalScores();
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ground=H*.78;if(player)player.y=ground-player.h-player.vy*0}addEventListener('resize',resize);resize();
function startMusic(){if(musicStarted)return;musicStarted=true;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const riff=[164.81,196,220,246.94,261.63,246.94,220,196,164.81,164.81,196,220,164.81,196,220,246.94,293.66,261.63,246.94,220,196,220,246.94,261.63];const roots=[82.41,82.41,82.41,82.41,110,110,82.41,82.41,123.47,110,82.41,123.47];function tone(freq,dur,type='square',vol=.025,when=0){const now=audioCtx.currentTime+when;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();osc.type=type;osc.frequency.value=freq;filter.type='lowpass';filter.frequency.value=type==='sawtooth'?1800:2600;gain.gain.setValueAtTime(vol,now);gain.gain.exponentialRampToValueAtTime(.001,now+dur);osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+dur)}function drum(type,when){const now=audioCtx.currentTime+when;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();if(type==='kick'){osc.type='sine';osc.frequency.setValueAtTime(120,now);osc.frequency.exponentialRampToValueAtTime(48,now+.12);gain.gain.setValueAtTime(.07,now);gain.gain.exponentialRampToValueAtTime(.001,now+.14)}else{osc.type='triangle';osc.frequency.value=type==='snare'?185:95;gain.gain.setValueAtTime(type==='snare'?.035:.02,now);gain.gain.exponentialRampToValueAtTime(.001,now+.07)}osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.15)}function noiseHit(dur,vol,when=0){const length=Math.max(1,Math.floor(audioCtx.sampleRate*dur));const buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate);const data=buffer.getChannelData(0);for(let j=0;j<length;j++)data[j]=(Math.random()*2-1)*(1-j/length);const src=audioCtx.createBufferSource(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();src.buffer=buffer;filter.type='highpass';filter.frequency.value=4500;gain.gain.setValueAtTime(vol,audioCtx.currentTime+when);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+when+dur);src.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);src.start(audioCtx.currentTime+when);src.stop(audioCtx.currentTime+when+dur)}function tick(){if(!playing){musicTimer=setTimeout(tick,160);return}const step=musicStep%96;const bar=Math.floor(step/8);const beat=step%8;const root=roots[bar%12];if(beat===0||beat===4)tone(root,.3,'triangle',.055);if(beat===2||beat===6)tone(root*1.5,.16,'triangle',.025);if(beat===0||beat===4)drum('kick',0);if(beat===2||beat===6)drum('snare',0);if(beat%2===0){const n=riff[(step*3+Math.floor(step/8)*2)%riff.length];tone(n,.17,'sawtooth',.025);tone(n*2,.12,'square',.008)}else if(Math.random()<.35){const blues=[164.81,196,220,233.08,246.94,293.66];tone(blues[Math.floor(Math.random()*blues.length)],.09,'square',.012)}if(beat%2===1)noiseHit(.035,.018);if(beat===2||beat===6){tone(1700,.025,'square',.012);noiseHit(.075,.045)}if(beat===3||beat===7)tone(7800,.018,'square',.008);musicStep++;const tempo=Math.max(105,155-(speed-390)*.035);musicTimer=setTimeout(tick,tempo)}tick()}catch(e){}}
function jumpSound(){if(!audioCtx)return;try{const now=audioCtx.currentTime;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='square';osc.frequency.setValueAtTime(260,now);osc.frequency.exponentialRampToValueAtTime(620,now+.16);gain.gain.setValueAtTime(.035,now);gain.gain.exponentialRampToValueAtTime(.001,now+.18);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.2)}catch(e){}}
function reset(){playing=true;dead=false;distance=0;speed=390;spawn=.9;starSpawn=2+Math.random()*2;player={x:W*.15,y:ground-70,w:34,h:70,vy:0,onGround:true,run:0,jumpBoost:false,boosting:false,boostTime:0};poops=[];dogs=[];stars=[];clouds=[];scenerySeed=Math.random()*1000;for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:40+Math.random()*H*.28,s:25+Math.random()*35,v:10+Math.random()*20});document.getElementById('message').classList.add('hidden')}
function jump(){startMusic();if(dead)return;if(!playing){reset();return}if(player.onGround){if(player.jumpBoost){player.vy=-1050;player.boosting=true;player.boostTime=2.8}else{player.vy=-780;player.boosting=false;player.boostTime=0}player.jumpBoost=false;player.onGround=false;jumpSound()}}
addEventListener('pointerdown',e=>{if(dead)return;if(e.target.id==='jump')return;if(e.target.closest('button,input'))return;jump()});
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
const fullscreenBtn=document.getElementById('fullscreen');
async function toggleFullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen();return}const target=document.getElementById('game');if(target.requestFullscreen){await target.requestFullscreen({navigationUI:'hide'});return}if(target.webkitRequestFullscreen){target.webkitRequestFullscreen();return}showFullscreenHelp()}catch(e){showFullscreenHelp()}}
function showFullscreenHelp(){const message=document.getElementById('message');message.innerHTML='<div class="card"><h1>⛶ Full Screen</h1><p>On iPhone, tap <b>Share</b> in your browser.</p><p>Choose <b>Add to Home Screen</b>, then open Dog Walker from your Home Screen.</p><p>Tap anywhere to close</p></div>';message.classList.remove('hidden');message.style.pointerEvents='auto';const close=()=>{message.classList.add('hidden');message.style.pointerEvents='none';message.removeEventListener('pointerdown',close)};message.addEventListener('pointerdown',close)}
fullscreenBtn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggleFullscreen()});document.addEventListener('fullscreenchange',()=>{fullscreenBtn.textContent=document.fullscreenElement?'⛶ EXIT FULL SCREEN':'⛶ FULL SCREEN'});document.addEventListener('webkitfullscreenchange',()=>{fullscreenBtn.textContent=document.webkitFullscreenElement?'⛶ EXIT FULL SCREEN':'⛶ FULL SCREEN'});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')jump()});
function rectHit(a,b){return a.x+5<b.x+b.w-4&&a.x+a.w-5>b.x+4&&a.y+8<b.y+b.h&&a.y+a.h>b.y+4}
function spawnPoop(){const size=18+Math.random()*7;const poopX=W+10+Math.random()*95;poops.push({x:poopX,y:ground-size*.72,w:size*1.35,h:size*.72});if(Math.random()<.22){const gap=22+Math.random()*18;const size2=17+Math.random()*6;poops.push({x:poopX+gap,y:ground-size2*.72,w:size2*1.35,h:size2*.72})}if(Math.random()<.62){const colors=[{body:'#a96b3d',light:'#c5844d',dark:'#754526'},{body:'#c08a55',light:'#ddb47a',dark:'#80552f'},{body:'#8b5a3c',light:'#b87852',dark:'#5e3b2b'},{body:'#d0a06a',light:'#e5c08b',dark:'#8a6038'},{body:'#6f513c',light:'#967052',dark:'#493426'}];const color=colors[Math.floor(Math.random()*colors.length)];dogs.push({x:W+55+Math.random()*85,y:ground-52,w:58,h:52,body:color.body,light:color.light,dark:color.dark})}}
function drawBackground(dt){
  // Bright blue sky and chunky, pixel-art clouds.
  ctx.fillStyle='#8fd4ff';ctx.fillRect(0,0,W,H);
  clouds.forEach(c=>{
    c.x-=c.v*.18*dt;if(c.x<-120)c.x=W+120;
    const x=Math.round(c.x),y=Math.round(c.y),w=Math.round(c.s);
    ctx.fillStyle='#ffffff';ctx.fillRect(x,y,w+14,9);ctx.fillRect(x+8,y-7,Math.round(w*.62),12);ctx.fillRect(x+Math.round(w*.55),y-3,Math.round(w*.52),10);
    ctx.fillStyle='#e5f6ff';ctx.fillRect(x+4,y+9,Math.round(w*.88),4);
    ctx.fillStyle='#c4eaff';ctx.fillRect(x+12,y+13,Math.round(w*.48),2);
  });

  // Distant mountains move slowly; stepped highlights keep the 16-bit look.
  const mountainOff=-(distance*13%440);
  for(let x=mountainOff-440;x<W+440;x+=440){
    ctx.fillStyle='#8ba9b6';ctx.beginPath();ctx.moveTo(x,ground-118);ctx.lineTo(x+76,ground-204);ctx.lineTo(x+118,ground-160);ctx.lineTo(x+218,ground-270);ctx.lineTo(x+296,ground-163);ctx.lineTo(x+356,ground-220);ctx.lineTo(x+440,ground-118);ctx.closePath();ctx.fill();
    ctx.fillStyle='#d0e0df';ctx.fillRect(x+205,ground-251,14,7);ctx.fillRect(x+219,ground-244,12,7);ctx.fillRect(x+225,ground-237,11,6);
    ctx.fillStyle='#708f9e';ctx.beginPath();ctx.moveTo(x+218,ground-270);ctx.lineTo(x+160,ground-181);ctx.lineTo(x+202,ground-197);ctx.lineTo(x+220,ground-181);ctx.lineTo(x+247,ground-205);ctx.lineTo(x+296,ground-163);ctx.closePath();ctx.fill();
  }

  // Rolling green hills: faster than mountains, slower than the forest.
  const hillOff=-(distance*25%220);
  for(let x=hillOff-220;x<W+220;x+=220){
    ctx.fillStyle='#9bcf91';ctx.fillRect(x,ground-111,220,15);
    ctx.fillStyle='#8bc483';ctx.fillRect(x+20,ground-126,150,15);ctx.fillRect(x+45,ground-137,92,11);
    ctx.fillStyle='#b3d99b';ctx.fillRect(x+30,ground-121,45,5);ctx.fillRect(x+150,ground-111,28,5);
  }

  // Low woodland-coloured ground stays behind the tree trunks.
  ctx.fillStyle='#9b704b';ctx.fillRect(0,ground-98,W,78);
  ctx.fillStyle='#805638';ctx.fillRect(0,ground-24,W,4);
  const soilOff=-(distance*100%37);
  for(let x=soilOff-37;x<W+37;x+=37){
    const xx=Math.round(x);
    ctx.fillStyle='#754c34';ctx.fillRect(xx+4,ground-82,4,3);ctx.fillRect(xx+23,ground-57,3,3);ctx.fillRect(xx+12,ground-36,5,2);
    ctx.fillStyle='#c18b5a';ctx.fillRect(xx+15,ground-72,5,2);ctx.fillRect(xx+29,ground-43,3,3);
  }

  // Distant trees: small, soft silhouettes with a slow parallax rate.
  const farOff=-(distance*39%112);
  for(let x=farOff-112;x<W+112;x+=112){
    const y=ground-24,tx=Math.round(x+45);
    ctx.fillStyle='#6c6546';ctx.fillRect(tx+12,y-49,6,49);
    ctx.fillStyle='#699a62';ctx.fillRect(tx-5,y-70,39,23);ctx.fillRect(tx+2,y-82,25,14);ctx.fillRect(tx-12,y-60,17,15);
    ctx.fillStyle='#85b873';ctx.fillRect(tx+2,y-70,14,5);ctx.fillRect(tx+17,y-82,8,5);
  }

  // Mid-distance trees move quicker and use distinct blocky canopy tiers.
  const midOff=-(distance*66%158);
  for(let x=midOff-158;x<W+158;x+=158){
    const y=ground-23,tx=Math.round(x+58);
    ctx.fillStyle='#69452f';ctx.fillRect(tx+18,y-68,10,68);ctx.fillRect(tx+12,y-35,6,12);
    ctx.fillStyle='#397744';ctx.fillRect(tx-10,y-89,62,31);ctx.fillRect(tx+1,y-105,43,18);ctx.fillRect(tx-19,y-75,20,19);ctx.fillRect(tx+43,y-76,19,18);
    ctx.fillStyle='#4e9950';ctx.fillRect(tx-4,y-85,25,8);ctx.fillRect(tx+8,y-101,21,6);ctx.fillRect(tx+39,y-70,10,7);
    ctx.fillStyle='#2e683b';ctx.fillRect(tx+3,y-61,12,8);ctx.fillRect(tx+32,y-58,9,7);
  }

  // Near trees are the strongest parallax layer, almost keeping pace with hazards.
  const nearOff=-(distance*88%196);
  for(let x=nearOff-196;x<W+196;x+=196){
    const y=ground-23,tx=Math.round(x+76);
    ctx.fillStyle='#513a2a';ctx.fillRect(tx+22,y-86,16,86);ctx.fillRect(tx+14,y-39,8,16);ctx.fillRect(tx+38,y-30,8,12);
    ctx.fillStyle='#285f36';ctx.fillRect(tx-13,y-110,83,33);ctx.fillRect(tx+1,y-129,56,22);ctx.fillRect(tx-25,y-94,24,21);ctx.fillRect(tx+57,y-96,22,20);
    ctx.fillStyle='#367d42';ctx.fillRect(tx-5,y-105,27,11);ctx.fillRect(tx+10,y-124,26,7);ctx.fillRect(tx+43,y-106,18,8);ctx.fillRect(tx-17,y-89,13,8);
    ctx.fillStyle='#55a34f';ctx.fillRect(tx+2,y-105,13,5);ctx.fillRect(tx+17,y-121,15,4);
    ctx.fillStyle='#754c34';ctx.fillRect(tx+25,y-17,4,3);ctx.fillRect(tx+30,y-34,4,3);
  }

  // A thin grass verge and pixel tufts sit in front of the woodland.
  ctx.fillStyle='#315f35';ctx.fillRect(0,ground-28,W,8);
  ctx.fillStyle='#68b95b';ctx.fillRect(0,ground-20,W,4);
  const grassOff=-(distance*100%43);
  for(let x=grassOff-43;x<W+43;x+=43){
    const xx=Math.round(x);
    ctx.fillStyle='#4b9d4d';ctx.fillRect(xx,ground-29,4,8);ctx.fillRect(xx+8,ground-32,4,11);ctx.fillRect(xx+18,ground-27,4,6);ctx.fillRect(xx+29,ground-30,3,9);
    ctx.fillStyle='#83ce61';ctx.fillRect(xx+8,ground-32,2,4);ctx.fillRect(xx+29,ground-30,2,3);
  }

  // Pixel-art pavement. Dashes now scroll at the same speed as the hazards.
  ctx.fillStyle='#b9b9b9';ctx.fillRect(0,ground-20,W,20);
  ctx.fillStyle='#8d8d8d';ctx.fillRect(0,ground,W,3);ctx.fillStyle='#d5d5d5';ctx.fillRect(0,ground-20,W,2);
  ctx.fillStyle='#a2a2a2';const roadOff=-(distance*100%70);
  for(let x=roadOff-70;x<W+70;x+=70){ctx.fillRect(Math.round(x),ground-12,34,3);ctx.fillRect(Math.round(x+3),ground-9,28,1);}
}function drawPerson(){const p=player,bob=p.onGround?Math.sin(p.run*12)*2:0;ctx.save();ctx.translate(p.x,p.y+bob);ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(17,72,23,5,0,0,7);ctx.fill();ctx.strokeStyle='#26384a';ctx.lineWidth=7;ctx.lineCap='round';let swing=p.onGround?Math.sin(p.run*12)*9:0;ctx.beginPath();ctx.moveTo(14,48);ctx.lineTo(11-swing*.35,68);ctx.moveTo(22,48);ctx.lineTo(25+swing*.35,68);ctx.stroke();ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(7-swing*.35,68);ctx.lineTo(15-swing*.35,68);ctx.moveTo(22+swing*.35,68);ctx.lineTo(31+swing*.35,68);ctx.stroke();ctx.fillStyle='#e85b52';ctx.fillRect(8,18,20,31);ctx.strokeStyle='#f0b58e';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(9,23);ctx.lineTo(1,39+swing*.25);ctx.moveTo(27,23);ctx.lineTo(34,38-swing*.25);ctx.stroke();ctx.fillStyle='#f0b58e';ctx.beginPath();ctx.arc(18,10,11,0,7);ctx.fill();ctx.fillStyle='#38271f';ctx.beginPath();ctx.arc(18,6,11,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(8,4,20,6);ctx.restore()}
function drawStar(s){ctx.save();ctx.translate(s.x+s.w/2,s.y+s.h/2);ctx.rotate(s.spin);ctx.shadowColor='#fff36b';ctx.shadowBlur=14;ctx.fillStyle='#ffd928';ctx.strokeStyle='#a66b00';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const r=i%2===0?s.w/2:s.w*.23;const x=Math.cos(a)*r,y=Math.sin(a)*r;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#fff8c7';ctx.fillRect(-3,-8,3,5);ctx.restore()}function drawPoop(o){ctx.save();ctx.translate(o.x,o.y);const t=performance.now()/360;ctx.strokeStyle='#806b3b';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(o.w*.28,-3);ctx.quadraticCurveTo(o.w*.05,-10+Math.sin(t+o.x*.02)*3,o.w*.28,-17);ctx.moveTo(o.w*.52,-4);ctx.quadraticCurveTo(o.w*.76,-12+Math.sin(t+1.7+o.x*.02)*3,o.w*.54,-21);ctx.moveTo(o.w*.75,-3);ctx.quadraticCurveTo(o.w*.98,-9+Math.sin(t+3+o.x*.02)*2,o.w*.78,-14);ctx.stroke();for(let i=0;i<2;i++){const a=t*(i?1.25:-1)+(o.x*.01)+i*Math.PI;const fx=o.w*.5+Math.cos(a)*(o.w*.65+5);const fy=-12+Math.sin(a*1.3)*(7+i*2);ctx.strokeStyle='#242424';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(fx-2,fy-2);ctx.lineTo(fx+2,fy+2);ctx.moveTo(fx+2,fy-2);ctx.lineTo(fx-2,fy+2);ctx.stroke();ctx.fillStyle='#252525';ctx.beginPath();ctx.arc(fx,fy,2,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#70401f';ctx.beginPath();ctx.moveTo(0,o.h);ctx.quadraticCurveTo(3,2,o.w*.35,o.h*.55);ctx.quadraticCurveTo(o.w*.45,0,o.w*.65,o.h*.5);ctx.quadraticCurveTo(o.w*.9,o.h*.1,o.w,o.h);ctx.closePath();ctx.fill();ctx.fillStyle='#8c582d';ctx.beginPath();ctx.arc(o.w*.7,o.h*.45,2.5,0,7);ctx.fill();ctx.restore()}
function drawDog(d){ctx.save();ctx.translate(d.x+d.w,d.y);ctx.scale(-1,1);ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(29,50,27,5,0,0,7);ctx.fill();ctx.strokeStyle='#7a4a2b';ctx.lineWidth=5;ctx.lineCap='round';const wag=Math.sin(performance.now()/75+(d.x*.035))*8;ctx.beginPath();ctx.moveTo(51,18);ctx.quadraticCurveTo(62,7+wag*.45,59+wag,0+wag);ctx.stroke();ctx.fillStyle=d.body;ctx.fillRect(17,15,35,23);ctx.fillStyle=d.light;ctx.fillRect(23,11,24,9);ctx.fillStyle=d.light;ctx.fillRect(24,14,25,4);ctx.strokeStyle=d.dark;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(23,35);ctx.lineTo(20,49);ctx.moveTo(35,35);ctx.lineTo(37,49);ctx.moveTo(45,35);ctx.lineTo(43,49);ctx.stroke();ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(12,19,14,0,7);ctx.fill();ctx.fillStyle=d.light;ctx.fillRect(-2,22,13,8);ctx.fillStyle=d.dark;ctx.beginPath();ctx.moveTo(7,8);ctx.lineTo(-4,2);ctx.lineTo(1,21);ctx.lineTo(9,17);ctx.closePath();ctx.fill();ctx.fillStyle='#161616';ctx.fillRect(7,15,3,3);ctx.fillRect(-2,25,4,4);ctx.fillStyle='#d94d4d';ctx.fillRect(5,27,13,4);ctx.restore()}
function update(dt){if(!playing||dead)return;distance+=speed*dt/100;speed+=dt*7.5;player.run+=dt;if(player.boosting){player.boostTime-=dt;if(player.y>ground-270&&player.vy<0){player.vy+=1500*dt;player.y+=player.vy*dt;if(player.vy>=0||player.y<ground-270){player.y=ground-270;player.vy=0}}else{player.y=ground-270;player.vy=0}if(player.boostTime<=0){player.boosting=false;player.vy=0}}else{player.vy+=2100*dt;player.y+=player.vy*dt}if(player.y+player.h>=ground){player.y=ground-player.h;player.vy=0;player.onGround=true;player.boosting=false}starSpawn-=dt;if(starSpawn<=0){const size=25;stars.push({x:W+25,y:ground-(85+Math.random()*95),w:size,h:size,spin:Math.random()*Math.PI*2});starSpawn=4+Math.random()*5}stars.forEach(s=>{s.x-=speed*dt;s.spin+=dt*3});stars=stars.filter(s=>s.x>-50);for(let i=stars.length-1;i>=0;i--){if(rectHit(player,stars[i])){player.jumpBoost=true;stars.splice(i,1)}}spawn-=dt;if(spawn<=0){spawnPoop();spawn=Math.max(.62,1.25-speed/1200)+(Math.random()*.55);if(Math.random()<.16)spawn-=.2}poops.forEach(o=>o.x-=speed*dt);dogs.forEach(d=>d.x-=speed*dt);poops=poops.filter(o=>o.x>-60);dogs=dogs.filter(d=>d.x>-100);for(const o of poops)if(rectHit(player,o)){gameOver();break}}
function gameOver(){dead=true;playing=false;const runScore=Math.floor(distance);best=Math.max(best,runScore);localStorage.dogWalkerBest=best;document.getElementById('best').textContent=best;const savedName=(localStorage.dogWalkerPlayer||'').replace(/"/g,'&quot;');document.getElementById('message').innerHTML='<div class="card"><h1>💩 SPLAT!</h1><p>You walked <b>'+runScore+'m</b></p><p>🏆 WORLD BEST: <b id="worldBestEnd">'+globalBest+'m</b></p><input id="playerName" maxlength="20" placeholder="Your name" value="'+savedName+'"><br><button id="submitScore">SAVE SCORE</button> <button id="playAgain">PLAY AGAIN</button><div id="leaderboard"></div></div>';document.getElementById('message').classList.remove('hidden');document.getElementById('message').style.pointerEvents='auto';renderLeaderboard();document.getElementById('submitScore').addEventListener('click',async e=>{e.stopPropagation();const btn=e.currentTarget;btn.disabled=true;btn.textContent='SAVING...';const ok=await submitScore(document.getElementById('playerName').value,runScore);btn.textContent=ok?'SAVED ✓':'TRY AGAIN';document.getElementById('worldBestEnd').textContent=globalBest+'m';renderLeaderboard()});document.getElementById('playAgain').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();document.getElementById('message').style.pointerEvents='none';reset()})}
function renderLeaderboard(){const el=document.getElementById('leaderboard');if(!el)return;const rows=leaderboard.slice(0,5).map((x,i)=>(i+1)+'. '+escapeHtml(x.player_name)+' — '+x.score+'m').join('<br>');el.innerHTML=rows?'<b>TOP 5</b><br>'+rows:'No scores yet'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function draw(){const zoom=1+Math.min(.5,Math.max(0,(speed-390)/500));const anchorX=player?player.x+player.w/2:W*.15;ctx.save();ctx.translate(anchorX,ground);ctx.scale(zoom,zoom);ctx.translate(-anchorX,-ground);drawBackground(1/60);stars.forEach(drawStar);dogs.forEach(drawDog);poops.forEach(drawPoop);if(player)drawPerson();ctx.restore();document.getElementById('score').textContent=Math.floor(distance)}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body></html>
