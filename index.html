function drawRat(r){ctx.save();const bob=Math.sin(performance.now()/70+r.phase)*2;ctx.translate(r.x,r.y+bob);ctx.strokeStyle="#6b536e";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(3,r.h*.65);ctx.quadraticCurveTo(-8,r.h*.5,-12,r.h*.8);ctx.stroke();ctx.fillStyle="#6e6878";ctx.beginPath();ctx.ellipse(r.w*.48,r.h*.58,r.w*.38,r.h*.28,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#918a9b";ctx.beginPath();ctx.arc(r.w*.78,r.h*.42,r.h*.22,0,Math.PI*2);ctx.fill();ctx.fillStyle="#b8a5bc";ctx.beginPath();ctx.arc(r.w*.7,r.h*.2,r.h*.12,0,Math.PI*2);ctx.arc(r.w*.9,r.h*.23,r.h*.1,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ff5e8a";ctx.fillRect(r.w*.91,r.h*.4,3,3);ctx.fillStyle="#34313b";ctx.fillRect(r.w*.34,r.h*.77,5,3);ctx.fillRect(r.w*.67,r.h*.77,5,3);ctx.restore()}
function drawPoop(o){ctx.save();ctx.translate(o.x,o.y);const t=performance.now()/360;ctx.strokeStyle='#806b3b';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(o.w*.28,-3);ctx.quadraticCurveTo(o.w*.05,-10+Math.sin(t+o.x*.02)*3,o.w*.28,-17);ctx.moveTo(o.w*.52,-4);ctx.quadraticCurveTo(o.w*.76,-12+Math.sin(t+1.7+o.x*.02)*3,o.w*.54,-21);ctx.moveTo(o.w*.75,-3);ctx.quadraticCurveTo(o.w*.98,-9+Math.sin(t+3+o.x*.02)*2,o.w*.78,-14);ctx.stroke();for(let i=0;i<2;i++){const a=t*(i?1.25:-1)+(o.x*.01)+i*Math.PI;const fx=o.w*.5+Math.cos(a)*(o.w*.65+5);const fy=-12+Math.sin(a*1.3)*(7+i*2);ctx.strokeStyle='#242424';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(fx-2,fy-2);ctx.lineTo(fx+2,fy+2);ctx.moveTo(fx+2,fy-2);ctx.lineTo(fx-2,fy+2);ctx.stroke();ctx.fillStyle='#252525';ctx.beginPath();ctx.arc(fx,fy,2,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#70401f';ctx.beginPath();ctx.moveTo(0,o.h);ctx.quadraticCurveTo(3,2,o.w*.35,o.h*.55);ctx.quadraticCurveTo(o.w*.45,0,o.w*.65,o.h*.5);ctx.quadraticCurveTo(o.w*.9,o.h*.1,o.w,o.h);ctx.closePath();ctx.fill();ctx.fillStyle='#8c582d';ctx.beginPath();ctx.arc(o.w*.7,o.h*.45,2.5,0,7);ctx.fill();ctx.restore()}
function drawDog(d){ctx.save();ctx.translate(d.x+d.w,d.y);ctx.scale(-1,1);const now=performance.now()*(emmaTime>0?.42:1),run=Math.sin(now/65+d.phase),wag=Math.sin(now/72+d.phase)*9;const sniff=d.behavior==="sniff"&&Math.sin(now/160+d.phase)>.1,hop=d.behavior==="hop"?Math.max(0,Math.sin(now/180+d.phase))*5:0;ctx.translate(0,-hop);ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(30,50+hop,30,5,0,0,7);ctx.fill();ctx.strokeStyle=d.dark;ctx.lineWidth=d.shape==="corgi"?4:5;ctx.lineCap='round';ctx.beginPath();const tailBase=d.shape==="corgi"?13:d.shape==="long"?5:18;ctx.moveTo(51,tailBase);ctx.quadraticCurveTo(61,tailBase-8+wag*.45,59+wag,tailBase-16+wag);ctx.stroke();ctx.fillStyle=d.body;const bodyX=d.shape==="long"?9:17,bodyW=d.shape==="long"?43:d.shape==="corgi"?35:35,bodyY=d.shape==="corgi"?18:15,bodyH=d.shape==="long"?17:23;ctx.fillRect(bodyX,bodyY,bodyW,bodyH);ctx.fillStyle=d.light;ctx.fillRect(bodyX+5,bodyY-4,bodyW-10,8);ctx.fillRect(bodyX+7,bodyY+bodyH-5,Math.max(10,bodyW-14),5);ctx.strokeStyle=d.dark;ctx.lineWidth=d.shape==="corgi"?6:5;ctx.beginPath();const legY=bodyY+bodyH-1;ctx.moveTo(bodyX+7,legY);ctx.lineTo(bodyX+5+run*3,49);ctx.moveTo(bodyX+17,legY);ctx.lineTo(bodyX+19-run*3,49);ctx.moveTo(bodyX+bodyW-11,legY);ctx.lineTo(bodyX+bodyW-12-run*3,49);ctx.stroke();ctx.fillStyle=d.body;const headY=sniff?25:19,headR=d.shape==="corgi"?12:d.shape==="terrier"?13:14;ctx.beginPath();ctx.ellipse(12,headY,headR,headR*.92,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=d.light;ctx.fillRect(-2,headY+3,14,7);ctx.fillStyle=d.dark;if(d.shape==="corgi"){ctx.beginPath();ctx.moveTo(5,10);ctx.lineTo(2,-1);ctx.lineTo(12,7);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(15,9);ctx.lineTo(21,-1);ctx.lineTo(22,13);ctx.closePath();ctx.fill()}else if(d.shape==="terrier"){ctx.fillRect(1,6,7,13);ctx.fillRect(13,6,7,12)}else{ctx.beginPath();ctx.moveTo(7,8);ctx.lineTo(d.shape==="long"?-8:0,1);ctx.lineTo(2,22);ctx.lineTo(9,17);ctx.closePath();ctx.fill()}ctx.fillStyle='#171717';ctx.fillRect(7,headY-4,3,3);ctx.fillRect(-2,headY+5,4,4);if(d.shape==="spot"){ctx.fillStyle='#252525';ctx.fillRect(25,20,6,6);ctx.fillRect(38,27,5,5);ctx.fillRect(12,10,4,4)}if(d.shape==="corgi"){ctx.fillStyle=d.light;ctx.fillRect(20,32,18,8)}if(sniff){ctx.strokeStyle=d.dark;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-2,headY+10);ctx.lineTo(-7,headY+12);ctx.stroke()}else if(Math.sin(now/120+d.phase)>.92){ctx.fillStyle='#d94d4d';ctx.fillRect(2,headY+9,8,5)}ctx.restore()}
function update(dt){if(!playing||dead)return;updateEmmaStorm(dt);if(seanTime>0){seanTime=Math.max(0,seanTime-dt);updateSeanHud();if(seanTime===0)rats=[];}if(niamhTime>0){niamhTime=Math.max(0,niamhTime-dt);updateNiamhHud();if(niamhTime===0)stopNiamhMidi();}if(emmaTime>0){emmaTime=Math.max(0,emmaTime-dt);updateEmmaHud();}const gameDt=dt*(emmaTime>0?.42:1);if(seanTime>0&&player){player.vy=-105+Math.sin(performance.now()/230)*55;player.onGround=false;player.y=ground-player.h-95+Math.sin(performance.now()/280)*22;}distance+=speed*gameDt/100;speed=Math.min(620,speed+gameDt*4.5);player.run+=gameDt;beachBalls.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=260*dt;b.rot+=b.spin*dt;if(b.x-b.r<0||b.x+b.r>W)b.vx*=-1;if(b.y+b.r>ground){b.y=ground-b.r;b.vy=-(180+Math.abs(b.vy)*.72);}if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy);}});if(niamhTime>0){for(let i=poops.length-1;i>=0;i--){const o=poops[i];const px=o.x+o.w/2,py=o.y+o.h*.55;if(beachBalls.some(b=>Math.hypot(b.x-px,b.y-py)<b.r+Math.max(o.w,o.h)*.35)){poops.splice(i,1);}}}poopExplosions.forEach(p=>{p.life-=dt;p.particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=280*dt;});});poopExplosions=poopExplosions.filter(p=>p.life>0);if(niamhTime>0){/* Niamh countdown uses real time above. */}if(niamhTime<=0&&emmaTime<=0&&seanTime<=0){starSpawn-=gameDt;if(starSpawn<=0){spawnStar();starSpawn=2.5+Math.random()*3.5;}}stars.forEach(s=>s.x-=speed*gameDt);stars=stars.filter(s=>s.x+s.w>-30);for(const s of stars){if(!s.collected&&rectHit(player,s)){s.collected=true;activateNiamhMode();}}stars=stars.filter(s=>!s.collected);if(niamhTime<=0&&emmaTime<=0&&seanTime<=0){emmaStarSpawn-=gameDt;if(emmaStarSpawn<=0){spawnEmmaStar();emmaStarSpawn=3+Math.random()*3.5;}}emmaStars.forEach(s=>s.x-=speed*gameDt);emmaStars=emmaStars.filter(s=>s.x+s.w>-30);for(const s of emmaStars){if(!s.collected&&rectHit(player,s)){s.collected=true;activateEmmaMode();}}emmaStars=emmaStars.filter(s=>!s.collected);if(niamhTime<=0&&emmaTime<=0&&seanTime<=0){seanStarSpawn-=gameDt;if(seanStarSpawn<=0){spawnSeanStar();seanStarSpawn=3+Math.random()*3.5;}}seanStars.forEach(s=>s.x-=speed*gameDt);seanStars=seanStars.filter(s=>s.x+s.w>-30);for(const s of seanStars){if(!s.collected&&rectHit(player,s)){s.collected=true;activateSeanMode();}}seanStars=seanStars.filter(s=>!s.collected);if(seanTime>0){ratSpawn-=dt;if(ratSpawn<=0){spawnRat();ratSpawn=.65+Math.random()*.9;}rats.forEach(r=>{r.x-=(speed*.55+r.speed*100)*dt;if(r.x<-50)r.x=W+20+Math.random()*80;r.y=ground-r.h-2+Math.sin(performance.now()/100+r.phase)*3;});}else rats=[];if(seanTime<=0){player.vy+=(jumpHeld&&player.vy<0?1250:2100)*gameDt;player.y+=player.vy*gameDt;}if(player.y+player.h>=ground&&seanTime<=0){player.y=ground-player.h;player.vy=0;player.onGround=true;player.boosting=false}spawn-=gameDt;if(spawn<=0){spawnPoop();spawn=Math.max(.62,1.25-speed/1200)+(Math.random()*.55);if(Math.random()<.16)spawn-=.2}poops.forEach(o=>o.x-=speed*gameDt);dogs.forEach(d=>d.x-=speed*gameDt);poops=poops.filter(o=>o.x>-60);dogs=dogs.filter(d=>d.x>-100);for(const o of poops){if(niamhTime<=0&&!o.hitPlayer&&rectHit(player,o)){o.hitPlayer=true;energy=Math.max(0,energy-ENERGY_LOSS_PER_POOP);updateEnergyHud();if(energy===0){gameOver();break}}if(!o.hitPlayer&&!o.countedPass&&o.x+o.w<player.x){o.countedPass=true;poopsJumped++;if(poopsJumped%POOPS_FOR_ENERGY===0){energy=Math.min(100,energy+ENERGY_RESTORE_PER_STREAK);updateEnergyHud()}}}}
function updateEnergyHud(){const fill=document.getElementById("energyFill"),value=document.getElementById("energyValue");if(!fill||!value)return;fill.style.width=energy+"%";value.textContent=energy+"%";fill.style.filter=energy<=25?"saturate(1.4) brightness(.9)":"none";fill.style.background=energy>50?"repeating-linear-gradient(90deg,#63d54b 0,#63d54b calc(10% - 3px),#245b35 calc(10% - 3px),#245b35 10%)":energy>25?"repeating-linear-gradient(90deg,#ffd447 0,#ffd447 calc(10% - 3px),#8b6b19 calc(10% - 3px),#8b6b19 10%)":"repeating-linear-gradient(90deg,#ff514b 0,#ff514b calc(10% - 3px),#8e2424 calc(10% - 3px),#8e2424 10%)"}
function gameOver(){dead=true;playing=false;const runScore=Math.floor(distance);best=Math.max(best,runScore);localStorage.dogWalkerBest=best;document.getElementById('best').textContent=best;const savedName=(localStorage.dogWalkerPlayer||'').replace(/"/g,'&quot;');document.getElementById('message').innerHTML='<div class="card"><h1>💩 SPLAT!</h1><p>💨 Your poop energy ran out!</p><p>You walked <b>'+runScore+'m</b></p><p>🏆 WORLD BEST: <b id="worldBestEnd">'+globalBest+'m</b></p><input id="playerName" maxlength="20" placeholder="Your name" value="'+savedName+'"><br><button id="submitScore">SAVE SCORE</button> <button id="playAgain">PLAY AGAIN</button><div id="leaderboard"></div></div>';document.getElementById('message').classList.remove('hidden');document.getElementById('message').style.pointerEvents='auto';renderLeaderboard();document.getElementById('submitScore').addEventListener('click',async e=>{e.stopPropagation();const btn=e.currentTarget;btn.disabled=true;btn.textContent='SAVING...';const ok=await submitScore(document.getElementById('playerName').value,runScore);btn.textContent=ok?'SAVED ✓':'TRY AGAIN';document.getElementById('worldBestEnd').textContent=globalBest+'m';renderLeaderboard()});document.getElementById('playAgain').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();document.getElementById('message').style.pointerEvents='none';reset()})}
function renderLeaderboard(){const el=document.getElementById('leaderboard');if(!el)return;const rows=leaderboard.slice(0,5).map((x,i)=>(i+1)+'. '+escapeHtml(x.player_name)+' — '+x.score+'m').join('<br>');el.innerHTML=rows?'<b>TOP 5</b><br>'+rows:'No scores yet'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function draw(){const zoom=1+Math.min(.35,Math.max(0,(speed-390)/650));const anchorX=player?player.x+player.w/2:W*.15;drawBackground((emmaTime>0?.42:1)/60);stars.forEach(drawStar);emmaStars.forEach(drawEmmaStar);seanStars.forEach(drawSeanStar);ctx.save();ctx.translate(anchorX,ground);ctx.scale(zoom,zoom);ctx.translate(-anchorX,-ground);dogs.forEach(drawDog);poops.forEach(drawPoop);if(player)drawPerson();ctx.restore();if(seanTime>0){rats.forEach(drawRat);const hue=(performance.now()/4)%360;ctx.save();ctx.globalAlpha=.17;ctx.fillStyle='hsl('+hue+',100%,55%)';ctx.fillRect(0,0,W,H);ctx.restore();}drawEmmaRain();drawEmmaLightning();drawPoopExplosions();drawBeachBalls();drawCarsInFront();document.getElementById('score').textContent=Math.floor(distance)}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
